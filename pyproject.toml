[tool.poetry]
name = "chat-ebook-ai"
version = "0.1.0"
description = "AI-powered RAG backend for eBook chat"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
pydantic = "^2.5.0"
langchain = "^0.1.0"
openai = "^1.3.0"
chromadb = "^0.4.18"
pinecone-client = "^2.2.4"
sentence-transformers = "^2.2.2"
google-generativeai = "^0.3.2"
elasticsearch = "^8.11.0"
python-multipart = "^0.0.6"  # For file uploads
dependency-injector = "^4.41.0"  # For DI
python-dotenv = "^1.0.0"
pymupdf = "^1.23.0"
pdf2image = "^1.17.0"
pytesseract = "^0.3.10"
pillow = "^10.1.0"
nltk = "^3.8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
httpx = "^0.25.2"  # For async testing
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
poethepoet = "^0.24.4"
ruff = "^0.1.9"
mypy = "^1.7.1"
black = "^23.11.0"
isort = "^5.12.0"

[tool.poe.tasks]
format = "black src tests"
format-check = "black --check src tests"
ruff-check = "ruff check src tests"
mypy-check = "mypy src"
test-unit = "pytest tests -v --cov=src --cov-report=html --cov-report=term"

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]  # assert false

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "google.generativeai.*",
    "elasticsearch.*",
    "pymupdf.*",
    "pdf2image.*",
    "pytesseract.*",
    "nltk.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"